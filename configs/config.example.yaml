server:
  port: 8080
  mode: debug # debug, release, test
  read_timeout: 60
  write_timeout: 60

database:
  host: localhost
  port: 3306
  username: root
  password: your_password
  dbname: blog_api
  charset: utf8mb4
  max_idle_conns: 10
  max_open_conns: 100
  conn_max_lifetime: 3600 # 1小时
  conn_max_idle_time: 1800 # 30分钟

redis:
  host: localhost
  port: 6379
  password: ""
  db: 0
  pool_size: 100
  min_idle_conns: 10
  dial_timeout: 5
  read_timeout: 3
  write_timeout: 3

jwt:
  secret: your-jwt-secret-key-change-in-production
  access_expire: 3600 # 1小时
  refresh_expire: 604800 # 7天
  issuer: blog-api

admin:
  username: 
  email: 
  nickname: 
  password: 

upload:
  path: ./uploads
  max_size: 10485760 # 10MB
  allowed_types:
    - image/jpeg
    - image/png
    - image/gif
    - image/webp
  base_url: "http://localhost:8080/uploads"

log:
  level: debug # debug, info, warn, error
  format: json # json, text
  file_path: ./logs/app.log
  max_size: 100 # MB
  max_backups: 30
  max_age: 7 # days
  compress: true

rate_limit:
  enabled: true
  requests_per_minute: 60
  burst: 10
  ip_limit: 100 # IP级别限流：100次/分钟
  user_limit: 1000 # 用户级别限流：1000次/小时

cors:
  allow_origins:
    - "http://localhost:3000"
    - "http://localhost:8080"
  allow_methods:
    - GET
    - POST
    - PUT
    - DELETE
    - OPTIONS
  allow_headers:
    - Origin
    - Content-Type
    - Authorization
  expose_headers:
    - Content-Length
  allow_credentials: true
  max_age: 12

cache:
  enabled: true
  default_ttl: "10m"
  redis_key_prefix: "blog_api:"
  cleanup_interval: "1h"

admin:
  username: username
  email: email
  nickname: nickname
  password: password
