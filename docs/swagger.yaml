basePath: /api/v1
definitions:
  controllers.FileResponse:
    properties:
      created_at:
        type: string
      filename:
        type: string
      hash:
        description: 可选返回哈希值
        type: string
      id:
        type: integer
      mime_type:
        type: string
      original_name:
        type: string
      ref_count:
        description: 可选返回引用计数
        type: integer
      size:
        type: integer
      url:
        type: string
    type: object
  models.Article:
    properties:
      allow_comment:
        description: 是否允许评论
        type: boolean
      category:
        $ref: '#/definitions/models.Category'
      category_id:
        type: integer
      comment_count:
        type: integer
      content:
        type: string
      cover_image:
        type: string
      created_at:
        type: string
      description:
        maxLength: 500
        type: string
      favorite_count:
        type: integer
      id:
        type: integer
      is_top:
        description: 是否置顶
        type: boolean
      like_count:
        type: integer
      published_at:
        type: string
      status:
        type: string
      tags:
        items:
          $ref: '#/definitions/models.Tag'
        type: array
      title:
        maxLength: 255
        type: string
      updated_at:
        type: string
      user:
        allOf:
        - $ref: '#/definitions/models.User'
        description: 关联关系
      user_id:
        type: integer
      view_count:
        type: integer
      visibility:
        type: string
    required:
    - content
    - title
    type: object
  models.Category:
    properties:
      color:
        description: 分类颜色
        type: string
      created_at:
        type: string
      description:
        type: string
      icon:
        description: 分类图标
        type: string
      id:
        type: integer
      is_active:
        description: 是否启用
        type: boolean
      name:
        maxLength: 50
        type: string
      sort:
        description: 排序权重
        type: integer
      updated_at:
        type: string
    required:
    - name
    type: object
  models.Comment:
    properties:
      article:
        $ref: '#/definitions/models.Article'
      article_id:
        type: integer
      children:
        items:
          $ref: '#/definitions/models.Comment'
        type: array
      content:
        maxLength: 1000
        type: string
      created_at:
        type: string
      id:
        type: integer
      ip:
        description: 评论者IP
        type: string
      like_count:
        type: integer
      parent:
        $ref: '#/definitions/models.Comment'
      parent_id:
        description: 父评论ID，用于回复
        type: integer
      status:
        type: string
      updated_at:
        type: string
      user:
        allOf:
        - $ref: '#/definitions/models.User'
        description: 关联关系
      user_agent:
        description: 用户代理
        type: string
      user_id:
        type: integer
    required:
    - content
    type: object
  models.FavoriteFolder:
    properties:
      created_at:
        type: string
      description:
        type: string
      id:
        type: integer
      is_default:
        description: 是否为默认收藏夹
        type: boolean
      is_public:
        description: 是否公开
        type: boolean
      name:
        maxLength: 50
        type: string
      sort:
        description: 排序权重
        type: integer
      updated_at:
        type: string
      user:
        allOf:
        - $ref: '#/definitions/models.User'
        description: 关联关系
      user_id:
        type: integer
    required:
    - name
    type: object
  models.Tag:
    properties:
      color:
        type: string
      created_at:
        type: string
      description:
        type: string
      id:
        type: integer
      name:
        maxLength: 50
        type: string
      updated_at:
        type: string
      use_count:
        description: 使用次数
        type: integer
    required:
    - name
    type: object
  models.User:
    properties:
      avatar:
        type: string
      bio:
        maxLength: 500
        type: string
      created_at:
        type: string
      email:
        type: string
      email_verified:
        type: boolean
      id:
        type: integer
      login_at:
        type: string
      nickname:
        maxLength: 50
        type: string
      role:
        type: string
      status:
        type: string
      updated_at:
        type: string
      username:
        maxLength: 50
        minLength: 3
        type: string
    required:
    - email
    - username
    type: object
  response.PageData:
    properties:
      list:
        description: 数据列表
      page:
        description: 当前页
        type: integer
      page_size:
        description: 每页大小
        type: integer
      pages:
        description: 总页数
        type: integer
      total:
        description: 总数
        type: integer
    type: object
  response.Response:
    properties:
      code:
        description: 业务状态码
        type: integer
      data:
        description: 响应数据
      message:
        description: 响应消息
        type: string
    type: object
  services.AdminUserResponse:
    properties:
      article_count:
        description: 统计信息
        type: integer
      avatar:
        type: string
      bio:
        type: string
      comment_count:
        type: integer
      created_at:
        type: string
      email:
        type: string
      email_verified:
        type: boolean
      favorite_count:
        type: integer
      id:
        type: integer
      like_count:
        type: integer
      login_at:
        type: string
      nickname:
        type: string
      role:
        type: string
      status:
        type: string
      updated_at:
        type: string
      username:
        type: string
    type: object
  services.ArticleDetailResponse:
    properties:
      allow_comment:
        type: boolean
      author:
        $ref: '#/definitions/services.UserResponse'
      category:
        $ref: '#/definitions/services.CategoryResponse'
      comment_count:
        type: integer
      content:
        type: string
      cover_image:
        type: string
      created_at:
        type: string
      description:
        type: string
      favorite_count:
        type: integer
      id:
        type: integer
      is_top:
        type: boolean
      like_count:
        type: integer
      published_at:
        type: string
      status:
        type: string
      title:
        type: string
      updated_at:
        type: string
      view_count:
        type: integer
      visibility:
        type: string
    type: object
  services.ArticleLikeResult:
    properties:
      is_liked:
        type: boolean
      like_count:
        type: integer
      message:
        type: string
    type: object
  services.ArticleResponse:
    properties:
      author:
        $ref: '#/definitions/services.UserResponse'
      category:
        $ref: '#/definitions/services.CategoryResponse'
      comment_count:
        type: integer
      cover_image:
        type: string
      created_at:
        type: string
      description:
        type: string
      favorite_count:
        type: integer
      id:
        type: integer
      is_top:
        type: boolean
      like_count:
        type: integer
      published_at:
        type: string
      status:
        type: string
      title:
        type: string
      updated_at:
        type: string
      view_count:
        type: integer
      visibility:
        type: string
    type: object
  services.CategoryListResponse:
    properties:
      article_count:
        type: integer
      color:
        type: string
      created_at:
        type: string
      description:
        type: string
      icon:
        type: string
      id:
        type: integer
      is_active:
        type: boolean
      name:
        type: string
      sort:
        type: integer
      updated_at:
        type: string
    type: object
  services.CategoryResponse:
    properties:
      color:
        type: string
      created_at:
        type: string
      description:
        type: string
      icon:
        type: string
      id:
        type: integer
      is_active:
        type: boolean
      name:
        type: string
      sort:
        type: integer
      updated_at:
        type: string
    type: object
  services.ChangePasswordRequest:
    properties:
      new_password:
        minLength: 6
        type: string
      old_password:
        type: string
    required:
    - new_password
    - old_password
    type: object
  services.CommentCreateRequest:
    properties:
      article_id:
        type: integer
      content:
        maxLength: 1000
        type: string
      parent_id:
        description: 父评论ID，可选
        type: integer
    required:
    - article_id
    - content
    type: object
  services.CommentLikeResult:
    properties:
      is_liked:
        type: boolean
      like_count:
        type: integer
      message:
        type: string
    type: object
  services.CommentListResponse:
    properties:
      article_id:
        type: integer
      children:
        items:
          $ref: '#/definitions/services.CommentListResponse'
        type: array
      content:
        type: string
      created_at:
        type: string
      id:
        type: integer
      is_liked:
        description: 当前用户是否已点赞
        type: boolean
      like_count:
        type: integer
      parent_id:
        type: integer
      status:
        type: string
      updated_at:
        type: string
      user:
        $ref: '#/definitions/services.CommentUserInfo'
      user_id:
        type: integer
    type: object
  services.CommentUpdateRequest:
    properties:
      content:
        maxLength: 1000
        type: string
    required:
    - content
    type: object
  services.CommentUserInfo:
    properties:
      avatar:
        type: string
      id:
        type: integer
      nickname:
        type: string
      username:
        type: string
    type: object
  services.ContentStats:
    properties:
      article_growth_rate:
        type: number
      comment_growth_rate:
        type: number
      new_articles:
        items:
          $ref: '#/definitions/services.DailyCount'
        type: array
      new_comments:
        items:
          $ref: '#/definitions/services.DailyCount'
        type: array
      total_articles:
        type: integer
      total_comments:
        type: integer
    type: object
  services.CreateArticleRequest:
    properties:
      allow_comment:
        type: boolean
      category_id:
        type: integer
      content:
        type: string
      cover_image:
        type: string
      description:
        maxLength: 500
        type: string
      status:
        enum:
        - draft
        - published
        type: string
      title:
        maxLength: 255
        type: string
      visibility:
        enum:
        - public
        - private
        type: string
    required:
    - content
    - title
    type: object
  services.CreateCategoryRequest:
    properties:
      color:
        maxLength: 7
        type: string
      description:
        maxLength: 500
        type: string
      icon:
        maxLength: 50
        type: string
      is_active:
        type: boolean
      name:
        maxLength: 50
        type: string
      sort:
        type: integer
    required:
    - name
    type: object
  services.CreateFolderRequest:
    properties:
      description:
        maxLength: 200
        type: string
      is_public:
        type: boolean
      name:
        maxLength: 50
        type: string
    required:
    - name
    type: object
  services.DailyCount:
    properties:
      count:
        type: integer
      date:
        type: string
    type: object
  services.FavoriteAddRequest:
    properties:
      article_id:
        type: integer
      folder_id:
        type: integer
    required:
    - article_id
    - folder_id
    type: object
  services.FavoriteStatusResponse:
    properties:
      folders:
        items:
          $ref: '#/definitions/services.FolderBasicInfo'
        type: array
      is_favorited:
        type: boolean
    type: object
  services.FolderBasicInfo:
    properties:
      id:
        type: integer
      is_default:
        type: boolean
      is_public:
        type: boolean
      name:
        type: string
    type: object
  services.ListArticleResponse:
    properties:
      articles:
        items:
          $ref: '#/definitions/services.ArticleResponse'
        type: array
      page:
        type: integer
      page_size:
        type: integer
      pages:
        type: integer
      total:
        type: integer
    type: object
  services.LoginRequest:
    properties:
      account:
        description: 用户名或邮箱
        type: string
      password:
        type: string
    required:
    - account
    - password
    type: object
  services.LoginResponse:
    properties:
      access_token:
        type: string
      expires_in:
        type: integer
      refresh_token:
        type: string
      user:
        $ref: '#/definitions/services.UserResponse'
    type: object
  services.RegisterRequest:
    properties:
      email:
        type: string
      nickname:
        maxLength: 50
        type: string
      password:
        minLength: 6
        type: string
      username:
        maxLength: 50
        minLength: 3
        type: string
    required:
    - email
    - password
    - username
    type: object
  services.SystemStats:
    properties:
      active_users:
        description: 最近30天活跃用户
        type: integer
      pending_comments:
        type: integer
      published_articles:
        type: integer
      total_articles:
        type: integer
      total_comments:
        type: integer
      total_favorites:
        type: integer
      total_files:
        type: integer
      total_likes:
        type: integer
      total_users:
        type: integer
    type: object
  services.TokenResponse:
    properties:
      access_token:
        type: string
      expires_in:
        type: integer
      refresh_token:
        type: string
    type: object
  services.UpdateArticleRequest:
    properties:
      allow_comment:
        type: boolean
      category_id:
        type: integer
      content:
        type: string
      cover_image:
        type: string
      description:
        maxLength: 500
        type: string
      status:
        enum:
        - draft
        - published
        type: string
      title:
        maxLength: 255
        type: string
      visibility:
        enum:
        - public
        - private
        type: string
    type: object
  services.UpdateCategoryRequest:
    properties:
      color:
        maxLength: 7
        type: string
      description:
        maxLength: 500
        type: string
      icon:
        maxLength: 50
        type: string
      is_active:
        type: boolean
      name:
        maxLength: 50
        type: string
      sort:
        type: integer
    type: object
  services.UpdateFolderRequest:
    properties:
      description:
        maxLength: 200
        type: string
      is_public:
        type: boolean
      name:
        maxLength: 50
        type: string
    required:
    - name
    type: object
  services.UpdateProfileRequest:
    properties:
      avatar:
        type: string
      bio:
        maxLength: 500
        type: string
      nickname:
        maxLength: 50
        type: string
    type: object
  services.UserResponse:
    properties:
      avatar:
        type: string
      bio:
        type: string
      created_at:
        type: string
      email:
        type: string
      email_verified:
        type: boolean
      id:
        type: integer
      login_at:
        type: string
      nickname:
        type: string
      role:
        type: string
      status:
        type: string
      updated_at:
        type: string
      username:
        type: string
    type: object
  services.UserStats:
    properties:
      active_users:
        items:
          $ref: '#/definitions/services.DailyCount'
        type: array
      growth_rate:
        type: number
      new_users:
        items:
          $ref: '#/definitions/services.DailyCount'
        type: array
      total_users:
        type: integer
    type: object
host: localhost:8080
info:
  contact:
    email: support@example.com
    name: API Support
    url: https://github.com/codepaintstudio/blog-api/issues
  description: 一个专为前端开发学习者提供的博客后端API系统
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: https://github.com/codepaintstudio/blog-api
  title: Blog API
  version: "1.0"
paths:
  /admin/stats/content:
    get:
      consumes:
      - application/json
      description: 管理员获取内容相关统计信息
      parameters:
      - default: 30
        description: 统计天数
        in: query
        name: days
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/services.ContentStats'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 获取内容统计
      tags:
      - 管理员
  /admin/stats/system:
    get:
      consumes:
      - application/json
      description: 管理员获取系统整体统计信息
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/services.SystemStats'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 获取系统统计
      tags:
      - 管理员
  /admin/stats/users:
    get:
      consumes:
      - application/json
      description: 管理员获取用户相关统计信息
      parameters:
      - default: 30
        description: 统计天数
        in: query
        name: days
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/services.UserStats'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 获取用户统计
      tags:
      - 管理员
  /admin/users:
    get:
      consumes:
      - application/json
      description: 管理员获取用户列表，支持筛选和分页
      parameters:
      - default: 1
        description: 页码
        in: query
        name: page
        type: integer
      - default: 20
        description: 每页数量
        in: query
        name: size
        type: integer
      - description: 用户角色
        enum:
        - admin
        - user
        in: query
        name: role
        type: string
      - description: 用户状态
        enum:
        - active
        - inactive
        in: query
        name: status
        type: string
      - description: 邮箱验证状态
        in: query
        name: email_verified
        type: boolean
      - description: 搜索关键词（用户名或邮箱）
        in: query
        name: keyword
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/response.PageData'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 获取用户列表
      tags:
      - 管理员
  /admin/users/{id}:
    delete:
      consumes:
      - application/json
      description: 管理员删除用户（软删除）
      parameters:
      - description: 用户ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 删除用户
      tags:
      - 管理员
    get:
      consumes:
      - application/json
      description: 管理员获取指定用户的详细信息
      parameters:
      - description: 用户ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/services.AdminUserResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 获取用户详情
      tags:
      - 管理员
  /admin/users/{id}/role:
    put:
      consumes:
      - application/json
      description: 管理员更新用户角色
      parameters:
      - description: 用户ID
        in: path
        name: id
        required: true
        type: integer
      - description: 角色信息
        in: body
        name: role
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Response'
